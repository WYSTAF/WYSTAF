<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 250" width="100%" height="250">
  <defs>
    <!-- Background Seam -->
    <linearGradient id="liminalGridBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0C0E"/>
      <stop offset="50%" stop-color="#121317"/>
      <stop offset="100%" stop-color="#08090B"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="aiCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA826"/>
      <stop offset="100%" stop-color="#FF6A00"/>
    </linearGradient>

    <linearGradient id="psCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C4FF"/>
      <stop offset="50%" stop-color="#0074E4"/>
      <stop offset="100%" stop-color="#002855"/>
    </linearGradient>

    <linearGradient id="idCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366"/>
      <stop offset="100%" stop-color="#B80033"/>
    </linearGradient>

    <linearGradient id="figmaCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2E33"/>
      <stop offset="100%" stop-color="#141518"/>
    </linearGradient>

    <linearGradient id="blenderCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA7600"/>
      <stop offset="55%" stop-color="#343842"/>
      <stop offset="100%" stop-color="#1B1D22"/>
    </linearGradient>

    <linearGradient id="pyCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D608B"/>
      <stop offset="100%" stop-color="#132738"/>
    </linearGradient>

    <linearGradient id="jsCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7DF1E"/>
      <stop offset="100%" stop-color="#D4B800"/>
    </linearGradient>

    <linearGradient id="unityCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C49"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>

    <linearGradient id="hfCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0"/>
      <stop offset="40%" stop-color="#FFD21E"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="linuxCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="cardSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0)"/>
    </linearGradient>

    <filter id="tileDropShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&amp;display=swap');

    .tool-tile {
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.25s ease;
      cursor: pointer;
    }
    .tool-tile:hover {
      transform: translateY(-4px);
      filter: drop-shadow(0 8px 12px rgba(13, 148, 136, 0.35));
    }

    .liminal-header {
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #2DD4BF;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }
    .liminal-label {
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #E2DBD0;
      text-anchor: middle;
      letter-spacing: 0.01em;
    }
    .liminal-num {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 7.5px;
      fill: rgba(255, 255, 255, 0.55);
      font-weight: 600;
    }
    .liminal-mark {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      letter-spacing: -0.03em;
    }
  </style>

  <!-- Container Frame -->
  <rect width="920" height="250" rx="16" fill="url(#liminalGridBg)"/>
  <rect x="1" y="1" width="918" height="248" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Top Metadata Header -->
  <g transform="translate(48, 26)">
    <text x="0" y="0" class="liminal-header">TACTILE ARSENAL // TOOLCHAIN SPECIFICATION</text>
    <!-- Plus Marks Accent -->
    <text x="790" y="0" fill="#6E6D6B" font-family="'Poppins', sans-serif" font-size="11">+ + + + +</text>
  </g>

  <!-- ==================== ROW 1: DESIGN (5 SQUIRCLE CARDS) ==================== -->
  <g transform="translate(0, 42)">

    <!-- 1. Illustrator - Center at X=112 -->
    <g transform="translate(80, 0)" class="tool-tile">
      <rect width="64" height="64" rx="16" fill="url(#aiCard)" filter="url(#tileDropShadow)"/>
      <rect x="0.75" y="0.75" width="62.5" height="30" rx="15" fill="url(#cardSpecular)"/>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <text x="8" y="14" class="liminal-num">01</text>
      <text x="32" y="43" text-anchor="middle" fill="#FFFFFF" class="liminal-mark" font-size="28">Ai</text>
      <text x="32" y="80" class="liminal-label">Illustrator</text>
    </g>

    <!-- 2. Photoshop - Center at X=277 -->
    <g transform="translate(245, 0)" class="tool-tile">
      <rect width="64" height="64" rx="16" fill="url(#psCard)" filter="url(#tileDropShadow)"/>
      <rect x="0.75" y="0.75" width="62.5" height="30" rx="15" fill="url(#cardSpecular)"/>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <text x="8" y="14" class="liminal-num">02</text>
      <text x="32" y="43" text-anchor="middle" fill="#31A8FF" class="liminal-mark" font-size="28">Ps</text>
      <text x="32" y="80" class="liminal-label">Photoshop</text>
    </g>

    <!-- 3. InDesign - Center at X=442 -->
    <g transform="translate(410, 0)" class="tool-tile">
      <rect width="64" height="64" rx="16" fill="url(#idCard)" filter="url(#tileDropShadow)"/>
      <rect x="0.75" y="0.75" width="62.5" height="30" rx="15" fill="url(#cardSpecular)"/>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <text x="8" y="14" class="liminal-num">03</text>
      <text x="32" y="43" text-anchor="middle" fill="#FF3366" class="liminal-mark" font-size="28">Id</text>
      <text x="32" y="80" class="liminal-label">InDesign</text>
    </g>

    <!-- 4. Figma - Center at X=607 -->
    <g transform="translate(575, 0)" class="tool-tile">
      <rect width="64" height="64" rx="16" fill="url(#figmaCard)" filter="url(#tileDropShadow)"/>
      <rect x="0.75" y="0.75" width="62.5" height="30" rx="15" fill="url(#cardSpecular)"/>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
      <text x="8" y="14" class="liminal-num">04</text>
      <g transform="translate(20, 14)">
        <path d="M6 0 C2.7 0 0 2.7 0 6 C0 9.3 2.7 12 6 12 L12 12 L12 0 Z" fill="#F24E1E"/>
        <path d="M12 0 L18 0 C21.3 0 24 2.7 24 6 C24 9.3 21.3 12 18 12 L12 12 Z" fill="#FF7262"/>
        <path d="M12 12 L6 12 C2.7 12 0 14.7 0 18 C0 21.3 2.7 24 6 24 L12 24 Z" fill="#A259FF"/>
        <path d="M12 12 L18 12 C21.3 12 24 14.7 24 18 C24 21.3 21.3 24 18 24 C14.7 24 12 21.3 12 18 Z" fill="#1ABCFE"/>
        <path d="M6 24 C2.7 24 0 26.7 0 30 C0 33.3 2.7 36 6 36 C9.3 36 12 33.3 12 30 L12 24 Z" fill="#0ACF83"/>
      </g>
      <text x="32" y="80" class="liminal-label">Figma</text>
    </g>

    <!-- 5. Blender - Center at X=772 -->
    <g transform="translate(740, 0)" class="tool-tile">
      <rect width="64" height="64" rx="16" fill="url(#blenderCard)" filter="url(#tileDropShadow)"/>
      <rect x="0.75" y="0.75" width="62.5" height="30" rx="15" fill="url(#cardSpecular)"/>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text x="8" y="14" class="liminal-num">05</text>
      <g transform="translate(18, 16)">
        <circle cx="14" cy="18" r="7" fill="#2563EB"/>
        <circle cx="14" cy="18" r="3.2" fill="#FFFFFF"/>
        <path d="M14 8 C18.5 8 25 11.5 26 17 C27 22.5 22 27 17 27 C12 27 6 23.5 5 18 C4 13.5 9 9 14 8 Z" fill="none" stroke="#FF7700" stroke-width="2.8"/>
        <path d="M14 6 L14 1 L17 1 L17 6 Z" fill="#FF7700"/>
        <path d="M21 9 L25 6 L27 8 L23 11 Z" fill="#FF7700"/>
        <path d="M7 9 L3 6 L5 4 L9 7 Z" fill="#FF7700"/>
      </g>
      <text x="32" y="80" class="liminal-label">Blender 3D</text>
    </g>

  </g>

  <!-- ==================== ROW 2: CODE & AI (5 SQUIRCLE CARDS) ==================== -->
  <g transform="translate(0, 142)">

    <!-- 6. Python - Center at X=112 -->
    <g transform="translate(80, 0)" class="tool-tile">
      <rect width="64" height="64" rx="16" fill="url(#pyCard)" filter="url(#tileDropShadow)"/>
      <rect x="0.75" y="0.75" width="62.5" height="30" rx="15" fill="url(#cardSpecular)"/>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text x="8" y="14" class="liminal-num">06</text>
      <g transform="translate(16, 16)">
        <path d="M16 0 C7 0 7.5 4 7.5 4 L7.5 8 L16 8 L16 9 L5 9 C5 9 0 8.5 0 17.5 C0 26.5 4.5 26 4.5 26 L7 26 L7 22.5 C7 22.5 6.5 17.5 12 17.5 L20.5 17.5 C20.5 17.5 25 17.5 25 13 L25 4 C25 4 25.5 0 16 0 Z" fill="#38BDF8"/>
        <circle cx="10.5" cy="4.5" r="1.5" fill="#FFFFFF"/>
        <path d="M16 32 C25 32 24.5 28 24.5 28 L24.5 24 L16 24 L16 23 L27 23 C27 23 32 23.5 32 14.5 C32 5.5 27.5 6 27.5 6 L25 6 L25 9.5 C25 9.5 25.5 14.5 20 14.5 L11.5 14.5 C11.5 14.5 7 14.5 7 19 L7 28 C7 28 6.5 32 16 32 Z" fill="#FFD43B"/>
        <circle cx="21.5" cy="27.5" r="1.5" fill="#1E293B"/>
      </g>
      <text x="32" y="80" class="liminal-label">Python</text>
    </g>

    <!-- 7. JavaScript - Center at X=277 -->
    <g transform="translate(245, 0)" class="tool-tile">
      <rect width="64" height="64" rx="16" fill="url(#jsCard)" filter="url(#tileDropShadow)"/>
      <rect x="0.75" y="0.75" width="62.5" height="30" rx="15" fill="url(#cardSpecular)"/>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1"/>
      <text x="8" y="14" class="liminal-num">07</text>
      <text x="32" y="43" text-anchor="middle" fill="#000000" class="liminal-mark" font-size="28">JS</text>
      <text x="32" y="80" class="liminal-label">JavaScript</text>
    </g>

    <!-- 8. Unity & C# - Center at X=442 -->
    <g transform="translate(410, 0)" class="tool-tile">
      <rect width="64" height="64" rx="16" fill="url(#unityCard)" filter="url(#tileDropShadow)"/>
      <rect x="0.75" y="0.75" width="62.5" height="30" rx="15" fill="url(#cardSpecular)"/>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
      <text x="8" y="14" class="liminal-num">08</text>
      <text x="32" y="42" text-anchor="middle" fill="#2DD4BF" class="liminal-mark" font-size="22">C#</text>
      <text x="32" y="80" class="liminal-label">C# / Unity</text>
    </g>

    <!-- 9. Hugging Face - Center at X=607 -->
    <g transform="translate(575, 0)" class="tool-tile">
      <rect width="64" height="64" rx="16" fill="url(#hfCard)" filter="url(#tileDropShadow)"/>
      <rect x="0.75" y="0.75" width="62.5" height="30" rx="15" fill="url(#cardSpecular)"/>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
      <text x="8" y="14" class="liminal-num">09</text>
      <g transform="translate(18, 16)">
        <circle cx="14" cy="15" r="13" fill="#FFD21E"/>
        <ellipse cx="9.5" cy="12" rx="1.8" ry="3" fill="#1F2937"/>
        <ellipse cx="18.5" cy="12" rx="1.8" ry="3" fill="#1F2937"/>
        <path d="M9.5 19 Q14 23.5 18.5 19" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="4" cy="16.5" rx="3" ry="4.5" fill="#FBBF24" transform="rotate(-25 4 16.5)"/>
        <ellipse cx="24" cy="16.5" rx="3" ry="4.5" fill="#FBBF24" transform="rotate(25 24 16.5)"/>
      </g>
      <text x="32" y="80" class="liminal-label">Hugging Face</text>
    </g>

    <!-- 10. Linux / CLI - Center at X=772 -->
    <g transform="translate(740, 0)" class="tool-tile">
      <rect width="64" height="64" rx="16" fill="url(#linuxCard)" filter="url(#tileDropShadow)"/>
      <rect x="0.75" y="0.75" width="62.5" height="30" rx="15" fill="url(#cardSpecular)"/>
      <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
      <text x="8" y="14" class="liminal-num">10</text>
      <text x="32" y="41" text-anchor="middle" fill="#38BDF8" font-family="'Poppins', monospace" font-weight="700" font-size="20">&gt;_</text>
      <text x="32" y="80" class="liminal-label">Linux / Cloud</text>
    </g>

  </g>
</svg>
